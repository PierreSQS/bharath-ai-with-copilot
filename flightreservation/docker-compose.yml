services:
  flightreservation-app:
    container_name: flightreservation_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://flightreservation_db:3306/reservation_db?useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: flightadmin
      SPRING_DATASOURCE_PASSWORD: flightadmin
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: flightreservation_db
    image: mysql:latest
    environment:
      MYSQL_DATABASE: reservation_db
      MYSQL_USER: flightadmin
      MYSQL_PASSWORD: flightadmin
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # copy the files under the sql-scripts folder to the docker-entrypoint-initdb.d folder in the container
      - ./sql-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 10s
      timeout: 20s
      retries: 5

volumes:
  db_data: